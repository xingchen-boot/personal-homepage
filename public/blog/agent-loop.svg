<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Tool Agent 循环示意">
  <rect width="960" height="340" rx="16" fill="#0f1629"/>
  <text x="32" y="40" fill="#c9dcff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">FrontCode · Tool Agent 循环</text>

  <g font-family="Segoe UI, sans-serif" filter="drop-shadow(0 3px 4px rgba(0,0,0,0.25))">
    <rect x="60" y="90" width="160" height="70" rx="12" fill="#5b8def"/>
    <text x="140" y="122" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">用户输入</text>
    <text x="140" y="142" text-anchor="middle" fill="#eef4ff" font-size="11">上下文组装</text>

    <rect x="280" y="90" width="160" height="70" rx="12" fill="#5b8def"/>
    <text x="360" y="122" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">模型决策</text>
    <text x="360" y="142" text-anchor="middle" fill="#eef4ff" font-size="11">回复 or 调工具</text>

    <rect x="500" y="90" width="160" height="70" rx="12" fill="#ff7eb3"/>
    <text x="580" y="122" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">执行工具</text>
    <text x="580" y="142" text-anchor="middle" fill="#fff7fb" font-size="11">MCP / Skill / Shell</text>

    <rect x="720" y="90" width="160" height="70" rx="12" fill="#64b5f6"/>
    <text x="800" y="122" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">结果回传</text>
    <text x="800" y="142" text-anchor="middle" fill="#eef4ff" font-size="11">进入下一轮</text>
  </g>

  <path d="M220 125 H274" stroke="#8eb6ff" stroke-width="2.5"/>
  <path d="M440 125 H494" stroke="#8eb6ff" stroke-width="2.5"/>
  <path d="M660 125 H714" stroke="#8eb6ff" stroke-width="2.5"/>
  <path d="M800 160 V210 H360 V160" stroke="#ff9ec8" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
  <text x="520" y="200" fill="#ff9ec8" font-family="Segoe UI, sans-serif" font-size="12">未完成则继续循环</text>

  <rect x="60" y="240" width="840" height="70" rx="12" fill="#172038"/>
  <text x="84" y="270" fill="#c9dcff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">周边能力</text>
  <text x="84" y="294" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="12">MCP 热插拔 · Markdown Skill 按需注入 · LanceDB RAG / 跨会话记忆 · 多模态路由</text>
</svg>
