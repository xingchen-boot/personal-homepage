<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="虚拟列表示意">
  <rect width="960" height="320" rx="16" fill="#0f1629"/>
  <text x="32" y="40" fill="#c9dcff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">虚拟列表：只渲染可视区 + 缓冲带</text>

  <!-- full list ghost -->
  <text x="80" y="78" fill="#6f86ad" font-family="Segoe UI, sans-serif" font-size="13">全量 DOM（万级）</text>
  <g opacity="0.35">
    <rect x="80" y="92" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="116" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="140" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="164" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="188" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="212" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="236" width="200" height="18" rx="4" fill="#5b8def"/>
    <rect x="80" y="260" width="200" height="18" rx="4" fill="#5b8def"/>
  </g>
  <text x="100" y="300" fill="#ff9ec8" font-family="Segoe UI, sans-serif" font-size="12">~800MB / 掉帧</text>

  <!-- arrow -->
  <path d="M320 180 H400" stroke="#8eb6ff" stroke-width="3"/>
  <polygon points="400,172 418,180 400,188" fill="#8eb6ff"/>

  <!-- viewport -->
  <text x="460" y="78" fill="#6f86ad" font-family="Segoe UI, sans-serif" font-size="13">虚拟化后</text>
  <rect x="450" y="92" width="220" height="180" rx="10" fill="none" stroke="#ff7eb3" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="118" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="11">上方占位（scrollHeight）</text>
  <rect x="470" y="132" width="180" height="22" rx="5" fill="#3a5f9e" opacity="0.5"/>
  <rect x="470" y="160" width="180" height="22" rx="5" fill="#5b8def"/>
  <rect x="470" y="188" width="180" height="22" rx="5" fill="#5b8def"/>
  <rect x="470" y="216" width="180" height="22" rx="5" fill="#5b8def"/>
  <rect x="470" y="244" width="180" height="22" rx="5" fill="#3a5f9e" opacity="0.5"/>
  <text x="490" y="176" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11">可见行</text>
  <text x="478" y="258" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="11">缓冲带</text>
  <text x="480" y="300" fill="#9ec0ff" font-family="Segoe UI, sans-serif" font-size="12">~30 DOM / ~280MB / 55fps+</text>

  <!-- notes -->
  <rect x="720" y="100" width="200" height="150" rx="12" fill="#172038"/>
  <text x="740" y="132" fill="#c9dcff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">关键动作</text>
  <text x="740" y="160" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="12">1. 计算 start/end</text>
  <text x="740" y="184" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="12">2. 复用行节点</text>
  <text x="740" y="208" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="12">3. 补偿 scrollTop</text>
  <text x="740" y="232" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="12">4. 可变行高估测</text>
</svg>
