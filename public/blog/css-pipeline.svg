<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="CSS 下沉链路示意">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#7aa8f5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#ff9ec8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a2a55" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="280" rx="16" fill="#0f1629"/>
  <text x="32" y="42" fill="#c9dcff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">CSS 下沉目标链路</text>
  <!-- boxes -->
  <g filter="url(#shadow)" font-family="Segoe UI, sans-serif">
    <rect x="32" y="78" width="150" height="88" rx="12" fill="url(#g1)"/>
    <text x="107" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Vue SFC</text>
    <text x="107" y="140" text-anchor="middle" fill="#eef4ff" font-size="12">模板 / 样式 / scoped</text>

    <rect x="220" y="78" width="150" height="88" rx="12" fill="url(#g1)"/>
    <text x="295" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">编译产物</text>
    <text x="295" y="140" text-anchor="middle" fill="#eef4ff" font-size="12">cssMap / 选择器表</text>

    <rect x="408" y="78" width="150" height="88" rx="12" fill="url(#g1)"/>
    <text x="483" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">窗级共享</text>
    <text x="483" y="140" text-anchor="middle" fill="#eef4ff" font-size="12">多窗口复用静态图</text>

    <rect x="596" y="78" width="150" height="88" rx="12" fill="url(#g2)"/>
    <text x="671" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">StyleEngine</text>
    <text x="671" y="140" text-anchor="middle" fill="#fff7fb" font-size="12">级联 / 权重 / 变量</text>

    <rect x="784" y="78" width="144" height="88" rx="12" fill="url(#g2)"/>
    <text x="856" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Fabric</text>
    <text x="856" y="140" text-anchor="middle" fill="#fff7fb" font-size="12">原生渲染</text>
  </g>
  <!-- arrows -->
  <g stroke="#8eb6ff" stroke-width="2.5" fill="#8eb6ff">
    <path d="M186 122 H214" marker-end="url(#arrow)"/>
    <path d="M374 122 H402"/>
    <path d="M562 122 H590"/>
    <path d="M750 122 H778"/>
  </g>
  <text x="32" y="220" fill="#9db4d8" font-family="Segoe UI, sans-serif" font-size="13">编译期结构化 → 窗级共享 → 运行时级联 → 脏集增量刷新</text>
  <text x="32" y="246" fill="#6f86ad" font-family="Segoe UI, sans-serif" font-size="12">650 节点调试页：冷挂载约 44.859s → 378ms，选择器解析次数约降 99%</text>
</svg>
